# =====================================================================
#  실험 1 · 인스턴스 사양을 t3.large로 올렸을 때  → 보고서 [표 5-4]
#
#  서론에서 "크레딧이 얼마나 깎일지 몰라 겁이 나서 가장 작은 사양만 골랐다"고 썼다.
#  사양을 올리면 실제로 얼마가 느는지를 배포 없이 확인한다.
#
#  실행:
#    infracost breakdown --config-file infracost-large.yml --format json --out-file result-large.json
#    python analyze.py result-large.json
#
#  ※ --config-file 은 --terraform-var 와 함께 쓸 수 없으므로
#    변수는 아래처럼 terraform_vars 로 넘긴다.
# =====================================================================

version: 0.1

projects:
  - path: design-a
    name: A안_최소구성
    usage_file: infracost-usage.yml
    terraform_vars:
      instance_type: t3.large

  - path: design-b
    name: B안_가용성구성
    usage_file: infracost-usage.yml
    terraform_vars:
      instance_type: t3.large

  - path: design-c
    name: C안_관리형구성
    usage_file: infracost-usage.yml
    terraform_vars:
      instance_type: t3.large
